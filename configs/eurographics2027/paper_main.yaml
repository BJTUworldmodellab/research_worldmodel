version: "2026-08-05-eg04-freeze-v1"
track: "Eurographics 2027"
status: "EG-04 method/config/code freeze"
freeze_date: "2026-08-05"

freeze_scope:
  purpose: >
    Freeze the single Eurographics 2027 main method before EG-05, EG-06, EG-07,
    and EG-08. Later experiments may fix bugs and rerun from a versioned
    successor, but must not tune thresholds after seeing results.
  skipped_tasks:
    eg03_cw_gcp_decision:
      status: "skipped_no_go"
      reason: >
        EG-03 was explicitly skipped for the current submission path. CW-GCP is
        therefore not promoted to the main method in this freeze.
      consequence: "The main method remains Collision-gated Floor-Prior."

git_freeze:
  repository: "BJTUworldmodellab/research_worldmodel"
  branch: "agent/eg01-eg02-eurographics2027"
  method_code_commit: "feb37414db42faec3d600b66d17186ed3da8a22e"
  note: >
    The commit above is the current code/text anchor before adding this EG-04
    freeze record. The EG-04 record itself is committed afterward and points
    back to this method-code anchor.

main_method:
  id: "collision_gated_floor_prior"
  display_name: "Collision-gated Floor-Prior"
  role: "unique Eurographics 2027 main method"
  generator: "InstructScene"
  training: "no retraining; post-generation layout repair"
  relation_source: "explicit spatial relation triples parsed from instructions"
  edit_space: "bounded XZ floor-plane translation; object heights preserved"
  selection_gate: "fallback to baseline layout when FCL mesh collision pairs increase"
  default_config_id: "floor_prior_max1.8_mesh_p2_close0.75_far1.6"
  default_hyperparameters:
    repair_passes: 2
    close_distance: 0.75
    far_distance: 1.6
    max_repair_move: 1.8
    repair_overlap_weight: 1.0
    preserve_height: true
    collision_gate: true

main_result_anchor:
  status: "current EG-01 anchor; must be regenerated by EG-07 final rerun"
  evaluator_status: "EG-05 independent evaluator still required before final evidence gate"
  rooms:
    bedroom:
      scene_count: 162
      baseline_relation_accuracy: 0.7388
      ungated_floor_prior_relation_accuracy: 0.8408
      gated_relation_accuracy: 0.8163
      gated_gain_pp: 7.76
      baseline_mesh_pair_collision: 0.0702
      gated_mesh_pair_collision: 0.068293
      fallback_scenes: 6
    livingroom:
      scene_count: 192
      baseline_relation_accuracy: 0.5510
      ungated_floor_prior_relation_accuracy: 0.6939
      gated_relation_accuracy: 0.6395
      gated_gain_pp: 8.84
      baseline_mesh_pair_collision: 0.0313
      gated_mesh_pair_collision: 0.030959
      fallback_scenes: 14
    diningroom:
      scene_count: 177
      baseline_relation_accuracy: 0.5948
      ungated_floor_prior_relation_accuracy: 0.7286
      gated_relation_accuracy: 0.6729
      gated_gain_pp: 7.81
      baseline_mesh_pair_collision: 0.0342
      gated_mesh_pair_collision: 0.033615
      fallback_scenes: 15
  weighted_summary:
    scene_count: 531
    gated_relation_accuracy: 0.704
    gated_gain_pp: 8.2

variant_roles:
  direct_repair:
    role: "aggressive ablation only"
    can_replace_main_method: false
    reason: "larger relation gains but much larger movements and weaker safety story"
  ungated_floor_prior:
    role: "diagnostic ablation only"
    can_replace_main_method: false
    reason: "shows effect before collision gate; mesh-collision pair delta is slightly positive"
  commonscenes_generic_gate:
    role: "cross-generator diagnostic support"
    can_replace_main_method: false
    reason: "different generator and different metric; official CommonScenes score must remain diagnostic"
  sg_guarded_overlap_repair:
    role: "layout-only safety ablation"
    can_replace_main_method: false
    reason: "not ground-truth relation accuracy and not mesh-level collision evaluation"

paper_claim_policy:
  allowed_main_claim: >
    Collision-gated Floor-Prior improves realized explicit spatial-relation
    accuracy on InstructScene bedroom, living-room, and dining-room validation
    splits while keeping FCL mesh-collision pair rates below the baseline.
  required_caveats:
    - "EG-05 independent evaluator is still required before final evidence lock."
    - "EG-06 movement-matched baselines are still required before final baseline claims."
    - "EG-08 paired bootstrap confidence intervals are still required before statistical claims."
    - "No superiority over ReSpace, SDGScenes, or CommonScenes official metrics may be claimed without same-protocol evidence."
  forbidden_as_main_numbers:
    - "0.8449"
    - "0.6871"
    - "0.7212"
    - "10.2"
    - "14.3"
    - "13.4"

downstream_requirements:
  every_experiment_output_must_record:
    - "code_commit"
    - "config_path"
    - "config_sha256"
    - "data_version_or_source_paths"
    - "room_split"
    - "scene_count"
    - "seed_or_seed_policy"
    - "environment_summary"
    - "command"
    - "log_path"
    - "output_path"
  next_tasks:
    eg05: "Implement and validate independent evaluator against this freeze."
    eg06: "Add movement-matched random and generic optimizer baselines under this freeze."
    eg07: "Rerun full frozen version after EG-05 and EG-06."
    eg08: "Compute paired scene-level bootstrap confidence intervals from EG-07 outputs."
