version: "2026-07-28-b-track-v2"
status: "CCF-B submission-oriented provisional freeze"
owner_track: "A-method-and-evaluation"

paper_scope:
  project_name: "3D Indoor Scene Constraint Projection"
  target_venues:
    primary:
      - "Eurographics 2027 Full Papers / Computer Graphics Forum (CCF-B)"
    backup:
      - "Pacific Graphics full or technical papers (CCF-B)"
  submission_schedule:
    abstract_deadline_utc: "2026-09-25T23:59:00Z"
    full_paper_deadline_utc: "2026-10-01T23:59:00Z"
    recommended_main_pages_excluding_references: 10
    review: "double-blind, two-step"
    template: "EGauthorGuidelines-conf-sub.tex from the EG2027 SRMv2 package"
  central_claim: >
    Without retraining the generator, Relation-Aware Constraint Projection can
    improve explicit spatial-relation satisfaction in generated 3D indoor
    layouts through bounded floor-plane edits and safety gating, while
    controlling movement, overlap, and collision side effects.
  b_track_strategy:
    default_main_method: "collision_gated_floor_prior"
    method_upgrade_candidate: "FA-PSP v0.3"
    method_upgrade_cutoff: "2026-08-01"
    method_upgrade_status_2026_07_29: >
      NO-GO after the 531-record local CPU/OBB pilot. CW-GCP v0.2.1 reaches
      67.09% independent-code class-level relation accuracy versus 67.66% for
      Collision-gated Floor-Prior; the paired delta is -0.56 pp with 95% CI
      [-1.41, +0.14] pp under source-scene cluster bootstrap. The cached-FCL
      selector is also worse (66.81% and
      2.0829 mean mesh-collision pairs versus 67.66% and 2.0640). New solver
      candidates cannot be re-evaluated with FCL locally. Keep
      Collision-gated Floor-Prior as the paper main method.
    method_upgrade_status_2026_07_29_v04: >
      AGRP v0.4 is the strongest current main-method candidate but is not yet
      frozen as the final paper main method. On the 209-cluster development
      split it improves independent class-level relation accuracy over
      Collision-gated Floor-Prior by +3.04 pp with 95% cluster-bootstrap CI
      [+1.35, +5.05] pp. On the locked 291-cluster validation split it improves
      over Floor-Prior by +3.40 pp with CI [+1.75, +5.19] pp and over
      candidate-matched random by +7.77 pp with CI [+5.00, +11.03] pp. The
      method is a Pareto candidate: mean movement is 0.268m on validation
      versus 0.087m for Floor-Prior, while OBB collision pairs and OBB overlap
      decrease. Do not promote to final main method until a zero-overlap
      confirmatory source cohort, remote FCL recomputation, and human-audited
      evaluator subset pass.
    method_upgrade_status_2026_07_29_v05: >
      FA-PSP v0.3 supersedes AGRP v0.4 as the preferred local candidate, but
      remains NO-GO for final paper promotion. On the 209-cluster development
      partition it reaches 202/296 relations (68.24%) versus 195/296 (65.88%)
      for Collision-gated Floor-Prior, the same-budget continuous generic
      optimizer, and the clean no-proposal-nudge ablation. The paired gain is
      +2.37 pp with 95% source-cluster bootstrap CI [+0.67, +4.55] pp versus
      Floor-Prior; mean movement is only 1.025x Floor-Prior, all three room
      point estimates are positive, and no evaluated record worsens exact OBB
      pairs or overlap. Do not promote until a zero-overlap source cohort,
      remote FCL recomputation, and human-audited evaluator subset pass.
    upgrade_rule: >
      Upgrade the paper main method only if the time-boxed pilot passes the
      predeclared independent-evaluator, movement-budget, and FCL safety gates.
      Otherwise retain Collision-gated Floor-Prior and use CW-GCP or the
      generic optimizer as a control.
    required_before_submission:
      - "independent relation evaluator with a human-audited subset"
      - "movement-matched random and generic-optimizer controls"
      - "scene-level paired confidence intervals"
      - "one frozen-commit rerun with automatically generated paper tables"
      - "anonymous clean-environment artifact smoke test"
    optional_if_claim_removed:
      - "human visual-preference study"
      - "full same-protocol ReSpace reproduction"
      - "official SDGScenes reproduction"
  no_go_reason_until_b_core_complete: >
    Submission claims currently mix historical Direct Repair gating with
    Collision-gated Floor-Prior in some derived documents, and the final
    independent evaluator, movement-matched controls, paired statistics, and
    frozen rerun are incomplete. These issues must be closed before final paper
    numbers are used.

frozen_method_variants:
  upgrade_candidate_fapsp:
    id: "fapsp_v03"
    display_name: "Floor-Anchored Proposal-Set Projection"
    role: "preferred exploratory upgrade candidate for InstructScene"
    generator: "InstructScene"
    training: "no retraining; post-generation guarded projection"
    relation_source: "class-level explicit relation proposals"
    edit_space: "bounded XZ floor-plane translation"
    anchor: "Collision-gated Floor-Prior"
    frozen_development_hyperparameters:
      relation_margin: 0.02
      anchor_residual_cap: 0.10
      total_movement_cap: 3.6
      max_edited_objects: 3
      proposal_nudge: true
      coverage_first_selection: true
      strict_coverage_gain: true
    allowed_claim: >
      On the already seen development cohort, FA-PSP improves frozen
      class-level relation-evaluator accuracy over Floor-Prior and matched
      continuous/no-nudge controls while keeping mean movement within 1.05x
      Floor-Prior and preserving exact OBB safety proxies.
    forbidden_claims:
      - "Confirmed improvement on an untouched source cohort."
      - "Mesh-safe without remote FCL recomputation."
      - "Human-perceived visual improvement."
      - "Mention-level instance grounding."
      - "State of the art."

  main_method:
    id: "collision_gated_floor_prior"
    display_name: "Collision-gated Floor-Prior"
    role: "paper main method for InstructScene"
    generator: "InstructScene"
    training: "no retraining; post-generation repair"
    relation_source: "parsed explicit relation triples from instruction"
    edit_space: "bounded XZ floor-plane translation"
    safety_gate:
      enabled: true
      purpose:
        - "reject repairs that increase mesh-collision pair rate"
        - "retain substantial relation gains under safer geometry"
    default_hyperparameters:
      repair_passes: 2
      close_distance: 0.75
      far_distance: 1.6
      max_repair_move: 1.8
      repair_overlap_weight: 1.0
    allowed_claim: >
      Improves selected-relation accuracy on bedroom, livingroom, and
      diningroom InstructScene validation splits while reducing mesh-collision
      pair rate relative to baseline.
    forbidden_claims:
      - "All gains come from the graph-to-layout decoder."
      - "The method solves all language constraints or implicit commonsense."
      - "Direct Repair gains are main-method gains."

  ablation_direct_repair:
    id: "direct_repair"
    display_name: "Direct Repair"
    role: "aggressive ablation / upper-bound style comparison"
    generator: "InstructScene"
    training: "no retraining; post-generation repair"
    relation_source: "parsed explicit relation triples from instruction"
    edit_space: "direct relation-satisfaction movement"
    safety_gate:
      enabled: false
    allowed_claim: >
      Shows the larger relation-satisfaction gain available when collision
      safety is not enforced.
    forbidden_claims:
      - "Direct Repair is the paper main method."
      - "Direct Repair lowers mesh collision across all rooms."

  cross_generator_commonscenes:
    id: "commonscenes_generic_gate"
    display_name: "CommonScenes Generic-Gate"
    role: "cross-generator external-support experiment"
    generator: "CommonScenes"
    training: "no retraining; post-generation repair"
    relation_source: "generic geometric relations from CommonScenes outputs"
    edit_space: "bounded box edits with movement/collision/boundary gate"
    default_hyperparameters:
      max_move: 1.5
      passes: 2
      official_search: false
    allowed_claim: >
      Gives small but consistent generic geometric relation gains across
      bedroom, livingroom, diningroom, and library, and lowers collision
      penalty under a no-official-search setting.
    mandatory_disclosure:
      - "Bedroom official CommonScenes Total decreases from 0.9732 to 0.9696."
    forbidden_claims:
      - "The method improves the official CommonScenes metric."
      - "The method is fully better than CommonScenes."
      - "CommonScenes Generic-Gate numbers are the same metric as InstructScene selected-relation accuracy."

  safety_ablation_sg_guarded:
    id: "sg_guarded_overlap_repair"
    display_name: "SG-Guarded Overlap Repair"
    role: "layout-only safety ablation"
    generator: "InstructScene"
    training: "no retraining; post-generation repair"
    relation_source: "generated scene graph self-consistency"
    edit_space: "bbox-level XZ overlap reduction"
    allowed_claim: >
      Reduces oriented-box overlap on 162 bedroom layout-only scenes while
      preserving protected SG-layout consistency.
    forbidden_claims:
      - "This is ground-truth relation accuracy."
      - "This is 3D mesh collision."
      - "This proves human visual quality."

datasets:
  instructscene:
    rooms:
      bedroom:
        scene_count_main: 162
      livingroom:
        scene_count_main: 192
      diningroom:
        scene_count_main: 177
    current_evidence_source:
      - "docs/relation_aware_claim_validation_matrix.md"
      - "docs/relation_aware_instructscene_experiment_report.md"
    final_submission_requirement:
      - "rerun with independent evaluator from T01"
      - "rerun all main and multi-seed experiments from frozen commit"

  commonscenes:
    rooms:
      bedroom:
        scene_count: 162
      livingroom:
        scene_count: 52
      diningroom:
        scene_count: 69
      library:
        scene_count: 56
    current_evidence_source:
      - "docs/commonscenes_experiment_pack_20260713/commonscenes_generic_repair_experiment_report.md"
      - "docs/commonscenes_generic_no_official_search/"
    final_submission_requirement:
      - "keep official CommonScenes metric separate from generic geometric relation score"
      - "do not use official-search data in main claim"

seeds:
  policy: "All final reported experiments must declare seed(s) in table captions and manifests."
  instructscene_current:
    main_seed: "existing main validation seed from prior experiment package"
    multiseed: [0, 1, 2]
  commonscenes_current:
    note: "Current CommonScenes Generic-Gate evidence is primarily deterministic post-processing over exported scenes; reruns must record export seed/config when available."

metrics:
  main_instructscene:
    primary:
      - id: "selected_relation_accuracy"
        description: "Explicit target relation satisfaction under the frozen independent evaluator."
    safety:
      - id: "mesh_collision_pair_rate"
        description: "FCL mesh collision pair rate for retrieved/generated mesh layouts."
      - id: "movement_distance"
        description: "Per-object and per-scene bounded translation movement."
      - id: "footprint_overlap"
        description: "Coarse box/footprint overlap proxy; auxiliary only."

  commonscenes_external:
    primary:
      - id: "generic_geometric_relation_total"
        description: "Generic geometric relation satisfaction; not official CommonScenes Total."
    safety:
      - id: "collision_penalty"
      - id: "changed_box_ratio"
      - id: "mean_center_movement"
      - id: "rendered_ssim"
      - id: "glb_chamfer"
    diagnostic_only:
      - id: "official_commonscenes_total"
        description: "External diagnostic metric; not optimized and not the main claim."

claim_policy:
  abstract_may_use:
    - "Collision-gated Floor-Prior"
    - "selected-relation accuracy"
    - "mesh-collision pair rate"
  abstract_must_not_use:
    - "Direct Repair best numbers as main method"
    - "CommonScenes official score improvement"
    - "human visual preference without T06"
  visual_quality_policy: >
    Before T06 human preference/failure-rate evidence is completed, use only
    low-disturbance wording such as average rendered/geometric perturbation is
    small. Do not claim that human-perceived visual quality is better.

required_t05_outputs:
  - "configs/paper_main.yaml"
  - "docs/method_variant_matrix.md"
  - "docs/claim_to_table_map.md"
  - "docs/t05_submission_freeze_handoff_20260727.md"

downstream_interfaces:
  for_t01_independent_evaluator:
    must_read:
      - "configs/paper_main.yaml"
      - "docs/method_variant_matrix.md"
    deliverable_expected:
      - "evaluation/independent_protocol.md"
      - "evaluation/independent_relation_evaluator.py"
      - "results/independent_eval/summary.csv"
  for_t02_control_baselines:
    must_read:
      - "configs/paper_main.yaml"
      - "docs/method_variant_matrix.md"
      - "docs/claim_to_table_map.md"
  for_t03_rerun:
    must_read:
      - "configs/paper_main.yaml"
      - "docs/claim_to_table_map.md"
    rule: "Only final rerun results generated from this config, or a versioned successor, may enter paper tables."
