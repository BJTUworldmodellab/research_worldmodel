    - generic [ref=e16]:
      - heading "总总结论" [level=2] [ref=e17]
      - generic [ref=e18]: 当前工作最稳的定位是：我们不是提出一个全新的 3D 场景生成大模型，而是在现有 InstructScene 上发现并修复一个重要 failure mode：instruction 里的显式空间关系，在 scene graph 到 continuous layout 的解码过程中会丢失。我们的 Relation-Aware verifier-repair layer 可以在不重新训练、不构建新 benchmark 的前提下，显著提升最终 layout 的关系满足率。
      - generic [ref=e19]:
        - generic [ref=e20]:
          - generic [ref=e21]: 主方法
          - generic [ref=e22]: Floor-Prior Repair
        - generic [ref=e23]:
          - generic [ref=e24]: 主 benchmark
          - generic [ref=e25]: InstructScene
        - generic [ref=e26]:
          - generic [ref=e27]: 房间类型
          - generic [ref=e28]: "3"
        - generic [ref=e29]:
          - generic [ref=e30]: 归档文件
          - generic [ref=e31]: "596"
      - paragraph [ref=e32]:
        - text: 最安全的 paper claim 是：
        - strong [ref=e33]: Relation-Aware InstructScene identifies a graph-to-layout grounding gap and introduces a training-free relation verifier-repair layer that improves explicit spatial relation realization on existing InstructScene validation splits while preserving object height and controlling mesh collision with a collision-gated variant.
      - paragraph [ref=e34]: 目前已经能支撑一篇 paper seed：有方法、有 ablation、有 multi-seed、有 mesh collision、有高度诊断、有真实 3D-FUTURE mesh 展示、有 NeurIPS 模板初稿。它还不是“可直接主会稳投”的终稿，因为强外部 baseline 和正式人类视觉质量评估还没有完成。
    - generic [ref=e35]:
      - heading "创新点" [level=2] [ref=e36]
      - generic [ref=e37]:
        - generic [ref=e38]:
          - heading "1. 关系实现从 graph-level 推到 layout-level" [level=3] [ref=e39]
          - paragraph [ref=e40]: 以往很多 pipeline 关注 scene graph 是否包含关系，但最终物体坐标可能不满足关系。我们的核心问题是 final realized relation，而不是只看 symbolic graph。
        - generic [ref=e41]:
          - heading "2. 不新增 benchmark，不新增人工标注" [level=3] [ref=e42]
          - paragraph [ref=e43]: 所有实验使用现有 InstructScene validation prompts、官方 checkpoint 和已有 evaluator，避免“自己造数据自己赢”的风险。
        - generic [ref=e44]:
          - heading "3. Plug-in verifier-repair layer" [level=3] [ref=e45]
          - paragraph [ref=e46]: 方法不替换原生成模型，而是在输出后解析、验证、修复，训练自由，适合作为 pretrained generator 的关系一致性控制模块。
        - generic [ref=e47]:
          - heading "4. Floor-prior 修复与高度保持" [level=3] [ref=e48]
          - paragraph [ref=e49]: 最终版本只移动 x/z 地面平面，不改 y 高度，解决了早期家具、椅子、沙发腾空的问题。
        - generic [ref=e50]:
          - heading "5. Collision-gated 选择" [level=3] [ref=e51]
          - paragraph [ref=e52]: 当 mesh collision pair 增加时回退到 baseline layout，使 mesh-validity claim 更安全。
        - generic [ref=e53]:
          - heading "6. 分层评估体系" [level=3] [ref=e54]
