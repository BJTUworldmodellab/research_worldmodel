    - generic [ref=e90]:
      - heading "我们的方法" [level=2] [ref=e91]
      - paragraph [ref=e92]: 方法整体是一个 training-free post-generation module，坐在 InstructScene 生成结果之后。
      - generic [ref=e93]:
        - generic [ref=e94]:
          - generic [ref=e95]: 1. 生成
          - text: 使用 InstructScene 生成 scene graph 和 layout boxes。
        - generic [ref=e96]:
          - generic [ref=e97]: 2. 解析
          - text: 从 instruction 中抽取显式空间关系，如 left/right/front/behind。
        - generic [ref=e98]:
          - generic [ref=e99]: 3. 匹配
          - text: 把 relation triple 匹配到生成物体类别和实例。
        - generic [ref=e100]:
          - generic [ref=e101]: 4. 验证
          - text: 在 x/z 地面平面判断关系是否真的成立。
        - generic [ref=e102]:
          - generic [ref=e103]: 5. 修复
          - text: 用 bounded floor-prior candidate 移动物体。
        - generic [ref=e104]:
          - generic [ref=e105]: 6. 筛选
          - text: collision-gated variant 在 collision 增加时回退 baseline。
      - heading "Direct y-fixed repair" [level=3] [ref=e106]
      - paragraph [ref=e107]: 直接修复沿 x/z 移动物体并保持 y 不变。它 relation gain 很高，但平均移动幅度接近 2 米，容易让真实 mesh 展示显得不自然，所以更适合做 internal baseline。
      - heading "Floor-prior repair" [level=3] [ref=e108]
      - paragraph [ref=e109]:
        - text: 当前主方法在候选位移中选择更温和的修复：限制最大移动范围，考虑 overlap penalty，保留原始高度。推荐主配置是
        - generic [ref=e110]: floor_prior_max1.8_mesh_p2_close0.75_far1.6
        - text: 。
      - heading "Collision-gated repair" [level=3] [ref=e111]
      - paragraph [ref=e112]: 如果 repaired layout 的 FCL mesh collision pairs 比 baseline 更多，就回退 baseline。这让 mesh claim 更安全，但论文中必须说明这是 verifier-selection/fallback，不是纯生成器自动学到了 collision-free synthesis。
